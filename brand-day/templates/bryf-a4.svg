<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="210mm" height="297mm" viewBox="0 0 210 297" version="1.1" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns="http://www.w3.org/2000/svg">
<title>Бриф</title><sodipodi:namedview pagecolor="#ffffff" inkscape:document-units="mm"/>
<g inkscape:groupmode="layer" inkscape:label="Бланк" sodipodi:insensitive="true"><text x="15" y="25" style="font-family:Montserrat;font-weight:bold;font-size:10px;fill:#3a3a3a;text-anchor:start">БРИФ</text><text x="15" y="33" style="font-family:Montserrat;font-weight:normal;font-size:4.2px;fill:#8a8277;text-anchor:start">Технічне завдання на фірмовий стиль</text><text x="15" y="48" style="font-family:Montserrat;font-weight:bold;font-size:3.4px;fill:#3a3a3a;text-anchor:start">НАЗВА СТАРТАПУ</text><line x1="15" y1="60" x2="195" y2="60" style="stroke:#b9b2a7;stroke-width:0.3"/><text x="15" y="71" style="font-family:Montserrat;font-weight:bold;font-size:3.4px;fill:#3a3a3a;text-anchor:start">ЧИМ ЗАЙМАЄТЬСЯ (1 РЕЧЕННЯ)</text><line x1="15" y1="83" x2="195" y2="83" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="91" x2="195" y2="91" style="stroke:#b9b2a7;stroke-width:0.3"/><text x="15" y="102" style="font-family:Montserrat;font-weight:bold;font-size:3.4px;fill:#3a3a3a;text-anchor:start">ЦІЛЬОВА АУДИТОРІЯ: ХТО, ВІК, ІНТЕРЕСИ</text><line x1="15" y1="114" x2="195" y2="114" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="122" x2="195" y2="122" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="130" x2="195" y2="130" style="stroke:#b9b2a7;stroke-width:0.3"/><text x="15" y="141" style="font-family:Montserrat;font-weight:bold;font-size:3.4px;fill:#3a3a3a;text-anchor:start">ДЕ АУДИТОРІЯ ПОБАЧИТЬ БРЕНД</text><text x="15" y="146" style="font-family:Montserrat;font-weight:normal;font-size:3px;fill:#8a8277;text-anchor:start">плакат, Instagram, візитівка, вивіска…</text><line x1="15" y1="157" x2="195" y2="157" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="165" x2="195" y2="165" style="stroke:#b9b2a7;stroke-width:0.3"/><text x="15" y="176" style="font-family:Montserrat;font-weight:bold;font-size:3.4px;fill:#3a3a3a;text-anchor:start">3 ПРИКМЕТНИКИ, ЩО ОПИСУЮТЬ БРЕНД</text><text x="15" y="181" style="font-family:Montserrat;font-weight:normal;font-size:3px;fill:#8a8277;text-anchor:start">наприклад: швидкий, дружній, екологічний</text><line x1="15" y1="192" x2="195" y2="192" style="stroke:#b9b2a7;stroke-width:0.3"/><text x="15" y="203" style="font-family:Montserrat;font-weight:bold;font-size:3.4px;fill:#3a3a3a;text-anchor:start">КОНКУРЕНТИ (2–3) І ЧОГО В НИХ УНИКАТИ</text><line x1="15" y1="215" x2="195" y2="215" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="223" x2="195" y2="223" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="231" x2="195" y2="231" style="stroke:#b9b2a7;stroke-width:0.3"/><text x="15" y="242" style="font-family:Montserrat;font-weight:bold;font-size:3.4px;fill:#3a3a3a;text-anchor:start">ТИП ЛОГОТИПА</text><text x="15" y="247" style="font-family:Montserrat;font-weight:normal;font-size:3px;fill:#8a8277;text-anchor:start">шрифтовий / літерний / знак / комбінований / емблема</text><line x1="15" y1="258" x2="195" y2="258" style="stroke:#b9b2a7;stroke-width:0.3"/><text x="15" y="269" style="font-family:Montserrat;font-weight:bold;font-size:3.4px;fill:#3a3a3a;text-anchor:start">СЛОГАН (ЗА БАЖАННЯМ)</text><line x1="15" y1="281" x2="195" y2="281" style="stroke:#b9b2a7;stroke-width:0.3"/><text x="15" y="294" style="font-family:Montserrat;font-weight:bold;font-size:3.4px;fill:#3a3a3a;text-anchor:start">ПІДПИС ВИКЛАДАЧА (бриф затверджено)</text><line x1="15" y1="304" x2="100" y2="304" style="stroke:#b9b2a7;stroke-width:0.3"/></g>
<g inkscape:groupmode="layer" inkscape:label="Мої відповіді"></g></svg>