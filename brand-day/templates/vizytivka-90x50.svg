<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="90mm"
   height="50mm"
   viewBox="0 0 90 50"
   version="1.1"
   id="svg1"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <title>Шаблон візитівки 90×50 мм</title>
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:document-units="mm">
    <inkscape:page
       x="0"
       y="0"
       width="90"
       height="50"
       id="page1"
       inkscape:label="Лицьовий бік"
       margin="4"
       bleed="2" />
    <inkscape:page
       x="0"
       y="60"
       width="90"
       height="50"
       id="page2"
       inkscape:label="Зворотний бік"
       margin="4"
       bleed="2" />
  </sodipodi:namedview>
  <g
     inkscape:groupmode="layer"
     id="layer-bg"
     inkscape:label="Фон">
  </g>
  <g
     inkscape:groupmode="layer"
     id="layer-content"
     inkscape:label="Вміст">
  </g>
</svg>
