<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="210mm" height="297mm" viewBox="0 0 210 297" version="1.1" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns="http://www.w3.org/2000/svg">
<title>Заявка до друкарні</title><sodipodi:namedview pagecolor="#ffffff" inkscape:document-units="mm"/>
<g inkscape:groupmode="layer" inkscape:label="Бланк" sodipodi:insensitive="true"><text x="15" y="25" style="font-family:Montserrat;font-weight:bold;font-size:10px;fill:#3a3a3a;text-anchor:start">ЗАЯВКА ДО ДРУКАРНІ</text><text x="15" y="33" style="font-family:Montserrat;font-weight:normal;font-size:4.2px;fill:#8a8277;text-anchor:start">Бланк замовлення поліграфії (додаток Г)</text><text x="15" y="46" style="font-family:Montserrat;font-weight:bold;font-size:3px;fill:#3a3a3a;text-anchor:start">ЗАМОВНИК (ПІБ)</text><line x1="60" y1="47" x2="195" y2="47" style="stroke:#b9b2a7;stroke-width:0.3"/><text x="15" y="55" style="font-family:Montserrat;font-weight:bold;font-size:3px;fill:#3a3a3a;text-anchor:start">БРЕНД</text><line x1="60" y1="56" x2="195" y2="56" style="stroke:#b9b2a7;stroke-width:0.3"/><text x="15" y="64" style="font-family:Montserrat;font-weight:bold;font-size:3px;fill:#3a3a3a;text-anchor:start">ТЕЛЕФОН / E-MAIL</text><line x1="60" y1="65" x2="195" y2="65" style="stroke:#b9b2a7;stroke-width:0.3"/><text x="15" y="73" style="font-family:Montserrat;font-weight:bold;font-size:3px;fill:#3a3a3a;text-anchor:start">ДАТА</text><line x1="60" y1="74" x2="195" y2="74" style="stroke:#b9b2a7;stroke-width:0.3"/><rect x="15" y="88" width="180" height="11" style="fill:#f3e9dc"/><text x="17.5" y="95" style="font-family:Montserrat;font-weight:bold;font-size:3.6px;fill:#3a3a3a;text-anchor:start">Поле</text><text x="77.5" y="95" style="font-family:Montserrat;font-weight:bold;font-size:3.6px;fill:#3a3a3a;text-anchor:start">Візитівки</text><text x="117.5" y="95" style="font-family:Montserrat;font-weight:bold;font-size:3.6px;fill:#3a3a3a;text-anchor:start">Плакат</text><text x="157.5" y="95" style="font-family:Montserrat;font-weight:bold;font-size:3.6px;fill:#3a3a3a;text-anchor:start">Листівки</text><text x="17.5" y="103.8" style="font-family:Montserrat;font-weight:normal;font-size:3.0px;fill:#3a3a3a;text-anchor:start">Назва файлу</text><text x="17.5" y="114.8" style="font-family:Montserrat;font-weight:normal;font-size:3.0px;fill:#3a3a3a;text-anchor:start">Формат після обрізу, мм</text><text x="17.5" y="125.8" style="font-family:Montserrat;font-weight:normal;font-size:3.0px;fill:#3a3a3a;text-anchor:start">Виліт, мм</text><text x="17.5" y="136.8" style="font-family:Montserrat;font-weight:normal;font-size:3.0px;fill:#3a3a3a;text-anchor:start">Аркуш друку / виробів на</text><text x="17.5" y="140.4" style="font-family:Montserrat;font-weight:normal;font-size:3.0px;fill:#3a3a3a;text-anchor:start">аркуші</text><text x="17.5" y="147.8" style="font-family:Montserrat;font-weight:normal;font-size:3.0px;fill:#3a3a3a;text-anchor:start">Кольоровість (4+4, 4+0, 1+0)</text><text x="17.5" y="158.8" style="font-family:Montserrat;font-weight:normal;font-size:3.0px;fill:#3a3a3a;text-anchor:start">Папір (тип, щільність г/м²)</text><text x="17.5" y="169.8" style="font-family:Montserrat;font-weight:normal;font-size:3.0px;fill:#3a3a3a;text-anchor:start">Тираж, шт.</text><text x="17.5" y="180.8" style="font-family:Montserrat;font-weight:normal;font-size:3.0px;fill:#3a3a3a;text-anchor:start">Післядрукарське оброблення</text><text x="17.5" y="191.8" style="font-family:Montserrat;font-weight:normal;font-size:3.0px;fill:#3a3a3a;text-anchor:start">Орієнтовна вартість, грн</text><line x1="15" y1="88" x2="15" y2="198" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="75" y1="88" x2="75" y2="198" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="115" y1="88" x2="115" y2="198" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="155" y1="88" x2="155" y2="198" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="195" y1="88" x2="195" y2="198" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="88" x2="195" y2="88" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="99" x2="195" y2="99" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="110" x2="195" y2="110" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="121" x2="195" y2="121" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="132" x2="195" y2="132" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="143" x2="195" y2="143" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="154" x2="195" y2="154" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="165" x2="195" y2="165" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="176" x2="195" y2="176" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="187" x2="195" y2="187" style="stroke:#b9b2a7;stroke-width:0.3"/><line x1="15" y1="198" x2="195" y2="198" style="stroke:#b9b2a7;stroke-width:0.3"/><text x="15" y="210" style="font-family:Montserrat;font-weight:bold;font-size:3.4px;fill:#3a3a3a;text-anchor:start">РАЗОМ, ГРН</text><line x1="60" y1="211" x2="120" y2="211" style="stroke:#b9b2a7;stroke-width:0.3"/><text x="15" y="224" style="font-family:Montserrat;font-weight:bold;font-size:3.4px;fill:#3a3a3a;text-anchor:start">ПЕРЕД ВІДПРАВЛЕННЯМ ПЕРЕВІРЕНО</text><rect x="15" y="228.4" width="4.2" height="4.2" style="fill:none;stroke:#3a3a3a;stroke-width:0.3"/><text x="22" y="232" style="font-family:Montserrat;font-weight:normal;font-size:3.4px;fill:#3a3a3a;text-anchor:start">PDF/X-4, шрифти вбудовані або в кривих</text><rect x="15" y="235.4" width="4.2" height="4.2" style="fill:none;stroke:#3a3a3a;stroke-width:0.3"/><text x="22" y="239" style="font-family:Montserrat;font-weight:normal;font-size:3.4px;fill:#3a3a3a;text-anchor:start">Вильоти з усіх боків, мітки обрізу</text><rect x="15" y="242.4" width="4.2" height="4.2" style="fill:none;stroke:#3a3a3a;stroke-width:0.3"/><text x="22" y="246" style="font-family:Montserrat;font-weight:normal;font-size:3.4px;fill:#3a3a3a;text-anchor:start">Зображення не менше 300 dpi</text><rect x="15" y="249.4" width="4.2" height="4.2" style="fill:none;stroke:#3a3a3a;stroke-width:0.3"/><text x="22" y="253" style="font-family:Montserrat;font-weight:normal;font-size:3.4px;fill:#3a3a3a;text-anchor:start">Кольори перевірено екранною кольоропробою (CMYK)</text><rect x="15" y="256.4" width="4.2" height="4.2" style="fill:none;stroke:#3a3a3a;stroke-width:0.3"/><text x="22" y="260" style="font-family:Montserrat;font-weight:normal;font-size:3.4px;fill:#3a3a3a;text-anchor:start">Важливий текст у безпечній зоні</text><rect x="15" y="263.4" width="4.2" height="4.2" style="fill:none;stroke:#3a3a3a;stroke-width:0.3"/><text x="22" y="267" style="font-family:Montserrat;font-weight:normal;font-size:3.4px;fill:#3a3a3a;text-anchor:start">Назви файлів латиницею, без пробілів</text><text x="15" y="287" style="font-family:Montserrat;font-weight:normal;font-size:2.6px;fill:#8a8277;text-anchor:start">Ціни в прикладі умовні, для навчальної вправи. Справжні ціни й вимоги до файлів уточнюйте в друкарні.</text></g>
<g inkscape:groupmode="layer" inkscape:label="Мої відповіді"></g>
